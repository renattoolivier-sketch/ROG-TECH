name: Build Windows EXE (ROG-TECH Desktop)

on:
  push:
    branches: [ main, master, principal ]
    tags:
      - 'v*'
  release:
    types: [ published, created ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: 1. Checkout do Código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Instalar Dependências
        run: |
          npm install --force --no-audit --prefer-offline

      - name: 4. Compilar Frontend React + Vite
        run: |
          npm run build

      - name: 5. Instalar Electron & Ferramentas
        run: |
          npm install --save-dev electron electron-builder --force

      - name: 6. Gerar Executáveis Windows (.EXE Portátil + Instalador)
        run: |
          npx electron-builder --win --x64 --publish never

      - name: 7. Salvar Artefatos para Download Direto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ROG-TECH-Windows-EXE
          path: dist-electron/*.exe
          retention-days: 30

      - name: 8. Anexar Arquivos .EXE na Release do GitHub
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.ref == 'refs/heads/principal'
        continue-on-error: true
        run: |
          $tag = "${{ github.ref_name }}"
          if ([string]::IsNullOrEmpty($tag) -or $tag -eq "principal" -or $tag -eq "main") {
            $tag = "v2.4.0"
          }
          Write-Host "Enviando executáveis para a release $tag..."
          gh release upload $tag dist/*.exe --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
