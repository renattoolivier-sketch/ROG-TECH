name: Build Windows EXE (ROG-TECH Desktop)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Compilar App React + Vite
        run: npm run build

      - name: Instalar Electron & Electron-Builder
        run: npm install --save-dev electron electron-builder

      - name: Gerar Executavel Windows .EXE
        run: npx electron-builder --win --x64 -c.win.target=nsis -c.extraMetadata.main=electron/main.cjs

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvar Artefato EXE
        uses: actions/upload-artifact@v4
        with:
          name: ROG-TECH-Command-Center-Windows-x64
          path: dist/*.exe
